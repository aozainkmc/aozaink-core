import groovy.json.JsonOutput
import java.security.MessageDigest
import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

buildscript {
    repositories {
        maven {
            name = "NeoForge"
            url = "https://maven.neoforged.net/releases"
        }
        mavenCentral()
    }
    dependencies {
        classpath "net.neoforged.gradle:userdev:7.1.26"
    }
}

plugins {
    id "java-library"
}

apply plugin: "net.neoforged.gradle.userdev"

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

configurations {
    reducedNativeUnpacker {
        transitive = false
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

runs {
    configureEach {
        systemProperty "forge.logging.markers", "REGISTRIES"
        systemProperty "forge.logging.console.level", "debug"
        modSource project.sourceSets.main
        dependencies {
            runtime "com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}"
        }
    }

    client {
        systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
    }

    server {
        arguments.add("--nogui")
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"
    jarJar(implementation(group: "com.microsoft.onnxruntime", name: "onnxruntime")) {
        version {
            prefer project.onnxruntime_version
        }
    }
    compileOnly "org.tukaani:xz:${project.xz_version}"
    reducedNativeUnpacker "org.tukaani:xz:${project.xz_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        compatible_minecraft_versions: compatible_minecraft_versions,
        loader_version_range: loader_version_range,
        neo_version: neo_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(["META-INF/neoforge.mods.toml"]) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named("test", Test).configure {
    useJUnitPlatform()
}

tasks.named("jar", Jar).configure {
    archiveClassifier = "thin"
}

tasks.named("jarJar", Jar).configure {
    archiveClassifier = ""
}

def universalReducedRuntimeJar = layout.projectDirectory.file(
    "runtime/reduced/universal/onnxruntime-${project.onnxruntime_version}-reduced.jar"
)
def windowsReducedRuntimeJar = layout.projectDirectory.file(
    "runtime/reduced/win-x64/onnxruntime-${project.onnxruntime_version}-reduced.jar"
)
def hasUniversalReducedRuntime = universalReducedRuntimeJar.asFile.exists()
def reducedRuntimePlatform = hasUniversalReducedRuntime ? "universal" : "win-x64"
def reducedRuntimeClassifier = hasUniversalReducedRuntime ? "reduced" : "reduced-win-x64"
def reducedRuntimeArtifact = hasUniversalReducedRuntime
    ? "onnxruntime-${project.onnxruntime_version}-reduced.jar"
    : "onnxruntime-${project.onnxruntime_version}-reduced-win-x64.jar"
def reducedRuntimeJar = hasUniversalReducedRuntime ? universalReducedRuntimeJar : windowsReducedRuntimeJar
def reducedJarJarDirectory = layout.buildDirectory.dir("generated/reduced-jarjar")
def reducedRuntimeDirectory = layout.buildDirectory.dir("generated/reduced-runtime")
def reducedNativeDirectory = layout.buildDirectory.dir("generated/reduced-native")
def reducedNativeUnpackerArtifact = "xz-${project.xz_version}.jar"

def deleteStaleReducedVariant = tasks.register("deleteStaleReducedVariant", Delete) {
    def staleClassifier = hasUniversalReducedRuntime ? "reduced-win-x64" : "reduced"
    delete layout.buildDirectory.file(
        "libs/${base.archivesName.get()}-${project.version}-${staleClassifier}.jar"
    )
}

def prepareReducedJarJarMetadata = tasks.register("prepareReducedJarJarMetadata") {
    group = "build"
    description = "Generates NeoForge JarJar metadata for the reduced ONNX Runtime (${reducedRuntimePlatform})."
    inputs.property("onnxruntimeVersion", project.onnxruntime_version)
    inputs.property("runtimeArtifact", reducedRuntimeArtifact)
    inputs.property("xzVersion", project.xz_version)
    outputs.file(reducedJarJarDirectory.map { it.file("metadata.json") })

    doLast {
        def output = reducedJarJarDirectory.get().file("metadata.json").asFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
            jars: [[
                identifier: [
                    group: "com.microsoft.onnxruntime",
                    artifact: "onnxruntime-reduced-${reducedRuntimePlatform}"
                ],
                version: [
                    range: "[${project.onnxruntime_version},)",
                    artifactVersion: project.onnxruntime_version
                ],
                path: "META-INF/jarjar/${reducedRuntimeArtifact}",
                isObfuscated: false
            ], [
                identifier: [
                    group: "org.tukaani",
                    artifact: "xz"
                ],
                version: [
                    range: "[${project.xz_version},)",
                    artifactVersion: project.xz_version
                ],
                path: "META-INF/jarjar/${reducedNativeUnpackerArtifact}",
                isObfuscated: false
            ]]
        ])) + System.lineSeparator()
    }
}

def packReducedNatives = tasks.register("packReducedNatives") {
    group = "build"
    description = "Moves the reduced ONNX Runtime native libraries into xz-compressed Core resources."
    inputs.file(reducedRuntimeJar)
    inputs.files(configurations.reducedNativeUnpacker)
    outputs.dir(reducedRuntimeDirectory)
    outputs.dir(reducedNativeDirectory)

    doFirst {
        if (!reducedRuntimeJar.asFile.exists()) {
            throw new GradleException(
                "Reduced ONNX Runtime is missing: ${reducedRuntimeJar.asFile}. " +
                "Run tools/onnxruntime/build_reduced_runtime.ps1 first."
            )
        }
    }

    doLast {
        project.delete(reducedRuntimeDirectory, reducedNativeDirectory)
        def nativePrefix = "ai/onnxruntime/native/"
        def nativeRoot = reducedNativeDirectory.get().dir("META-INF/aozaink_core/onnxruntime-native").asFile
        def runtimeOutput = reducedRuntimeDirectory.get().file(reducedRuntimeArtifact).asFile
        nativeRoot.mkdirs()
        runtimeOutput.parentFile.mkdirs()
        def index = new TreeMap<String, String>()
        def xzLoader = new URLClassLoader(
            configurations.reducedNativeUnpacker.files.collect { it.toURI().toURL() } as URL[],
            (ClassLoader) null
        )
        def optionsClass = xzLoader.loadClass("org.tukaani.xz.LZMA2Options")
        def outputClass = xzLoader.loadClass("org.tukaani.xz.XZOutputStream")
        def filterOptionsClass = xzLoader.loadClass("org.tukaani.xz.FilterOptions")

        try {
            new ZipFile(reducedRuntimeJar.asFile).withCloseable { zip ->
                new ZipOutputStream(new FileOutputStream(runtimeOutput)).withCloseable { out ->
                    zip.entries().each { entry ->
                        if (entry.name.startsWith(nativePrefix)) {
                            if (entry.isDirectory()) {
                                return
                            }
                            def key = entry.name.substring(nativePrefix.length())
                            def bytes = zip.getInputStream(entry).bytes
                            def packed = new File(nativeRoot, "${key}.xz")
                            packed.parentFile.mkdirs()
                            def options = optionsClass.getConstructor(int).newInstance(9)
                            options.setDictSize(16 << 20)
                            outputClass.getConstructor(OutputStream, filterOptionsClass)
                                .newInstance(new FileOutputStream(packed), options)
                                .withCloseable { it.write(bytes) }
                            index[key] = "${bytes.length}:${MessageDigest.getInstance("SHA-256").digest(bytes).encodeHex()}"
                            return
                        }
                        def copy = new ZipEntry(entry.name)
                        copy.time = entry.time
                        out.putNextEntry(copy)
                        if (!entry.isDirectory()) {
                            zip.getInputStream(entry).withCloseable { out << it }
                        }
                        out.closeEntry()
                    }
                }
            }
        } finally {
            xzLoader.close()
        }

        if (index.isEmpty()) {
            throw new GradleException("Reduced ONNX Runtime contains no native libraries: ${reducedRuntimeJar.asFile}")
        }
        new File(nativeRoot, "index.properties").setText(
            index.collect { key, value -> "${key}=${value}" }.join("\n") + "\n",
            "UTF-8"
        )
    }
}

def reducedJar = tasks.register("reducedJar", Jar) {
    group = "build"
    description = "Builds Core with the model-specific reduced ONNX Runtime (${reducedRuntimePlatform})."
    archiveClassifier = reducedRuntimeClassifier
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    dependsOn tasks.named("jar")
    dependsOn prepareReducedJarJarMetadata
    dependsOn deleteStaleReducedVariant
    dependsOn packReducedNatives
    inputs.file(reducedRuntimeJar)

    doFirst {
        if (!reducedRuntimeJar.asFile.exists()) {
            throw new GradleException(
                "Reduced ONNX Runtime is missing: ${reducedRuntimeJar.asFile}. " +
                "Run tools/onnxruntime/build_reduced_runtime.ps1 first."
            )
        }
    }

    from(tasks.named("jar", Jar).flatMap { it.archiveFile }.map { zipTree(it) }) {
        exclude "META-INF/MANIFEST.MF"
        exclude "META-INF/jarjar/**"
    }
    from(reducedRuntimeDirectory) {
        into "META-INF/jarjar"
    }
    from(configurations.reducedNativeUnpacker) {
        into "META-INF/jarjar"
        rename { reducedNativeUnpackerArtifact }
    }
    from(reducedJarJarDirectory) {
        into "META-INF/jarjar"
    }
    from(reducedNativeDirectory)
}

artifacts {
    archives reducedJar
}

tasks.named("assemble") {
    dependsOn reducedJar
}

def reducedRuntimeTest = tasks.register("reducedRuntimeTest", Test) {
    group = "verification"
    description = "Runs Core tests against the reduced ONNX Runtime (${reducedRuntimePlatform})."
    dependsOn tasks.named("testClasses")
    dependsOn packReducedNatives
    inputs.file(reducedRuntimeJar)

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath.filter {
        !(it.name == "onnxruntime-${project.onnxruntime_version}.jar")
    } + files(
        reducedRuntimeDirectory.map { it.file(reducedRuntimeArtifact) },
        reducedNativeDirectory
    ) + configurations.reducedNativeUnpacker
    systemProperty "aozaink_core.native_cache",
        layout.buildDirectory.dir("tmp/reducedRuntimeTest/native-cache").get().asFile.absolutePath
    useJUnitPlatform()

    onlyIf {
        hasUniversalReducedRuntime ||
            System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")
    }
}

tasks.named("check") {
    dependsOn reducedRuntimeTest
}
