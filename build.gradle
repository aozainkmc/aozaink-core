import groovy.json.JsonOutput

buildscript {
    repositories {
        maven {
            name = "NeoForge"
            url = "https://maven.neoforged.net/releases"
        }
        mavenCentral()
    }
    dependencies {
        classpath "net.neoforged.gradle:userdev:7.1.26"
    }
}

plugins {
    id "java-library"
}

apply plugin: "net.neoforged.gradle.userdev"

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

runs {
    configureEach {
        systemProperty "forge.logging.markers", "REGISTRIES"
        systemProperty "forge.logging.console.level", "debug"
        modSource project.sourceSets.main
        dependencies {
            runtime "com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}"
        }
    }

    client {
        systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
    }

    server {
        arguments.add("--nogui")
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"
    jarJar(implementation(group: "com.microsoft.onnxruntime", name: "onnxruntime")) {
        version {
            prefer project.onnxruntime_version
        }
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        compatible_minecraft_versions: compatible_minecraft_versions,
        loader_version_range: loader_version_range,
        neo_version: neo_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(["META-INF/neoforge.mods.toml"]) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named("test", Test).configure {
    useJUnitPlatform()
}

tasks.named("jar", Jar).configure {
    archiveClassifier = "thin"
}

tasks.named("jarJar", Jar).configure {
    archiveClassifier = ""
}

def universalReducedRuntimeJar = layout.projectDirectory.file(
    "runtime/reduced/universal/onnxruntime-${project.onnxruntime_version}-reduced.jar"
)
def windowsReducedRuntimeJar = layout.projectDirectory.file(
    "runtime/reduced/win-x64/onnxruntime-${project.onnxruntime_version}-reduced.jar"
)
def hasUniversalReducedRuntime = universalReducedRuntimeJar.asFile.exists()
def reducedRuntimePlatform = hasUniversalReducedRuntime ? "universal" : "win-x64"
def reducedRuntimeClassifier = hasUniversalReducedRuntime ? "reduced" : "reduced-win-x64"
def reducedRuntimeArtifact = hasUniversalReducedRuntime
    ? "onnxruntime-${project.onnxruntime_version}-reduced.jar"
    : "onnxruntime-${project.onnxruntime_version}-reduced-win-x64.jar"
def reducedRuntimeJar = hasUniversalReducedRuntime ? universalReducedRuntimeJar : windowsReducedRuntimeJar
def reducedJarJarDirectory = layout.buildDirectory.dir("generated/reduced-jarjar")

def deleteStaleReducedVariant = tasks.register("deleteStaleReducedVariant", Delete) {
    def staleClassifier = hasUniversalReducedRuntime ? "reduced-win-x64" : "reduced"
    delete layout.buildDirectory.file(
        "libs/${base.archivesName.get()}-${project.version}-${staleClassifier}.jar"
    )
}

def prepareReducedJarJarMetadata = tasks.register("prepareReducedJarJarMetadata") {
    group = "build"
    description = "Generates NeoForge JarJar metadata for the reduced ONNX Runtime (${reducedRuntimePlatform})."
    inputs.property("onnxruntimeVersion", project.onnxruntime_version)
    inputs.property("runtimeArtifact", reducedRuntimeArtifact)
    outputs.file(reducedJarJarDirectory.map { it.file("metadata.json") })

    doLast {
        def output = reducedJarJarDirectory.get().file("metadata.json").asFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
            jars: [[
                identifier: [
                    group: "com.microsoft.onnxruntime",
                    artifact: "onnxruntime-reduced-${reducedRuntimePlatform}"
                ],
                version: [
                    range: "[${project.onnxruntime_version},)",
                    artifactVersion: project.onnxruntime_version
                ],
                path: "META-INF/jarjar/${reducedRuntimeArtifact}",
                isObfuscated: false
            ]]
        ])) + System.lineSeparator()
    }
}

def reducedJar = tasks.register("reducedJar", Jar) {
    group = "build"
    description = "Builds Core with the model-specific reduced ONNX Runtime (${reducedRuntimePlatform})."
    archiveClassifier = reducedRuntimeClassifier
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    dependsOn tasks.named("jar")
    dependsOn prepareReducedJarJarMetadata
    dependsOn deleteStaleReducedVariant
    inputs.file(reducedRuntimeJar)

    doFirst {
        if (!reducedRuntimeJar.asFile.exists()) {
            throw new GradleException(
                "Reduced ONNX Runtime is missing: ${reducedRuntimeJar.asFile}. " +
                "Run tools/onnxruntime/build_reduced_runtime.ps1 first."
            )
        }
    }

    from(tasks.named("jar", Jar).flatMap { it.archiveFile }.map { zipTree(it) }) {
        exclude "META-INF/MANIFEST.MF"
        exclude "META-INF/jarjar/**"
    }
    from(reducedRuntimeJar) {
        into "META-INF/jarjar"
        rename { reducedRuntimeArtifact }
    }
    from(reducedJarJarDirectory) {
        into "META-INF/jarjar"
    }
}

artifacts {
    archives reducedJar
}

tasks.named("assemble") {
    dependsOn reducedJar
}

def reducedRuntimeTest = tasks.register("reducedRuntimeTest", Test) {
    group = "verification"
    description = "Runs Core tests against the reduced ONNX Runtime (${reducedRuntimePlatform})."
    dependsOn tasks.named("testClasses")
    inputs.file(reducedRuntimeJar)

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath.filter {
        !(it.name == "onnxruntime-${project.onnxruntime_version}.jar")
    } + files(reducedRuntimeJar)
    useJUnitPlatform()

    onlyIf {
        hasUniversalReducedRuntime ||
            System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")
    }
}

tasks.named("check") {
    dependsOn reducedRuntimeTest
}
